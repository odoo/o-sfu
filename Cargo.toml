[workspace]
members = [
    "crates/core",
    "crates/model",
    "crates/protocol",
    "crates/rfc",
    "crates/router",
    "crates/telemetry",
    "tests",
    "tests/core-room",
    "tests/fuzz",
    "tests/proofs",
]
default-members = [
    ".",
    "crates/core",
    "crates/model",
    "crates/protocol",
    "crates/rfc",
    "crates/router",
    "crates/telemetry",
    "tests",
    "tests/core-room",
    "tests/proofs",
]
resolver = "3"

[profile.bench]
codegen-units = 1
incremental = false

[workspace.package]
authors = ["ThanhDodeurOdoo"]
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
rust-version = "1.95"
version = "0.11.4"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
futures-util = "0.3"
o-sfu-protocol = { path = "crates/protocol" }
o-sfu-core = { path = "crates/core" }
o-sfu-model = { path = "crates/model" }
o-sfu-rfc = { path = "crates/rfc" }
o-sfu-router = { path = "crates/router" }
o-sfu-telemetry = { path = "crates/telemetry", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
str0m = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.52", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
thiserror = "2.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(fuzzing)",
    "cfg(kani)",
    "cfg(rust_analyzer)",
] }
unsafe_code = "deny"

[workspace.lints.clippy] # https://rust-lang.github.io/rust-clippy/
correctness = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
indexing_slicing = { level = "deny", priority = -1 }
panic = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = { level = "deny", priority = -1 }

# groups
complexity = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"

absolute_paths = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
exit = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
non_ascii_literal = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
wildcard_dependencies = "warn"

# nursery as of rust 1.92 https://rust-lang.github.io/rust-clippy/rust-1.92.0/index.html?groups=nursery
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_if_let_else = "warn"
redundant_clone = "warn"
significant_drop_tightening = "warn"
single_option_map = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"

[package]
description = "o-sfu"
name = "o-sfu"
autotests = false
default-run = "o-sfu"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["otel-tracing"]
otel-tracing = ["o-sfu-telemetry/otel-tracing"]
testing-transport = ["o-sfu-core/testing-transport"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
hmac = { version = "0.13", features = ["zeroize"] }
o-sfu-protocol.workspace = true
o-sfu-core.workspace = true
o-sfu-rfc.workspace = true
o-sfu-router.workspace = true
o-sfu-telemetry.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11.0", features = ["zeroize"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
zeroize = "1.9.0"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[lints]
workspace = true

[dev-dependencies]
o-sfu-core = { workspace = true, features = ["testing-transport"] }
o-sfu-protocol.workspace = true
o-sfu-telemetry = { workspace = true, features = ["test-support"] }
o-sfu-router = { workspace = true, features = ["test-support"] }
str0m.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower = { version = "0.5", features = ["util"] }
