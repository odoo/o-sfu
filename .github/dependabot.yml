# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] root:"
      prefix-development: "[DEP] root (dev):"
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"
      - "app"

  - package-ecosystem: "cargo"
    directory: "/crates/router"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] router:"
      prefix-development: "[DEP] router (dev):"
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"
      - "router"

  - package-ecosystem: "cargo"
    directory: "/crates/core"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] core:"
      prefix-development: "[DEP] core (dev):"
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"
      - "core"

  - package-ecosystem: "cargo"
    directory: "/crates/telemetry"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] telemetry:"
      prefix-development: "[DEP] telemetry (dev):"
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"
      - "telemetry"

  - package-ecosystem: "cargo"
    directory: "/crates/protocol"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] protocol:"
      prefix-development: "[DEP] protocol (dev):"
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"
      - "protocol"

  - package-ecosystem: "cargo"
    directory: "/tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] tests:"
      prefix-development: "[DEP] tests (dev):"
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"
      - "tests"

  - package-ecosystem: "npm"
    directory: "/crates/client"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] client:"
      prefix-development: "[DEP] client (dev):"
    labels:
      - "dependencies"
      - "npm"
      - "AI"
      - "lang-js"
      - "client"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] root:"
      prefix-development: "[DEP] root (dev):"
    labels:
      - "dependencies"
      - "AI"
      - "security"
      - "ci"
      - "API-deployment"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql-action:
        # CodeQL init and analyze must use the same action version.
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[DEP] github-actions:"
      prefix-development: "[DEP] github-actions (dev):"
    labels:
      - "dependencies"
      - "github-actions"
      - "AI"
      - "ci"
