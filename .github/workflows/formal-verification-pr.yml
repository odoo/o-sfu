name: PR Formal Verification

on:
  pull_request:
    branches: [main, master]
    paths:
      - .github/actions/setup-rust/**
      - .github/workflows/formal-verification*.yml
      - rust-toolchain.toml
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KANI_VERSION: 0.68.0

jobs:
  kani-pr:
    name: PR Kani (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rfc-h264
            package: o-sfu-proofs
            harness: h264_profile_level_id_parse_matches_rfc_patterns
            timeout_minutes: 20
          - shard: rfc-vp8
            package: o-sfu-proofs
            harness: vp8_keyframe_prefix_matches_rfc_model
            covers: 11
            timeout_minutes: 30
          - shard: core-vp8-identity
            package: o-sfu-core
            harness: vp8_identity_projection_matches_modular_model
            covers: 10
            timeout_minutes: 30
          - shard: core-rtp-projection
            package: o-sfu-core
            harness: rtp_projection_matches_affine_model
            covers: 25
            timeout_minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          key: kani-${{ env.KANI_VERSION }}
          cache-bin: false

      - name: Install Kani
        run: |
          set -euo pipefail
          cargo install --locked --force kani-verifier --version "$KANI_VERSION"
          cargo kani setup
          cargo kani --version --verbose

      - name: Run PR Kani proof shard
        env:
          EXPECTED_COVERS: ${{ matrix.covers || 0 }}
          KANI_HARNESS: ${{ matrix.harness }}
          KANI_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          output="$(mktemp)"
          cargo kani --package "$KANI_PACKAGE" --lib \
            --harness "$KANI_HARNESS" --output-format terse 2>&1 | tee "$output"
          if (( EXPECTED_COVERS > 0 )) && \
            ! grep -Fq "** $EXPECTED_COVERS of $EXPECTED_COVERS cover properties satisfied" "$output"
          then
            echo "Expected $EXPECTED_COVERS satisfied cover properties" >&2
            exit 1
          fi
