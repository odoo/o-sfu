name: Workflow Lint

on:
  push:
    branches: [main, master]
    paths:
      - .github/actions/**
      - .github/dependabot.yml
      - .github/workflows/**
  pull_request:
    branches: [main, master]
    paths:
      - .github/actions/**
      - .github/dependabot.yml
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go v7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.10"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: |
          actionlint_path="$(go env GOPATH)/bin/actionlint"
          "$actionlint_path"

      - name: Setup Python
        # actions/setup-python v6
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.13"

      - name: Install zizmor
        run: |
          python -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/python" -m pip install --disable-pip-version-check zizmor==1.25.2

      - name: Run zizmor
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --min-severity=high .github
