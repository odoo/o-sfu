name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  BUILDX_VERSION: v0.36.1
  NODE_VERSION: 22.23.2
  REGISTRY: ghcr.io
  WASM_PACK_VERSION: 0.15.0

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Summarize release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]
          then
            echo "Release preflight requires complete Git history" >&2
            exit 1
          fi
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          cargo_version="$(python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as handle:
              manifest = tomllib.load(handle)

          version = manifest["package"]["version"]
          if isinstance(version, dict) and version.get("workspace") is True:
              version = manifest["workspace"]["package"]["version"]
          if not isinstance(version, str):
              raise SystemExit("workspace root package version not found")
          print(version)
          PY
          )"
          cargo_base_version="${cargo_version%%[-+]*}"
          result=FAIL
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([._-][A-Za-z0-9._-]+)?$ ]]
          then
            tag_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if [[ "$tag_version" == "$cargo_base_version" ]]
            then
              result=PASS
              version_detail="tag base version matches Cargo package version"
            else
              version_detail="tag base version $tag_version does not match Cargo package version"
            fi
          else
            version_detail="tag must use vX.Y.Z with an optional safe suffix"
          fi

          prior_tag=
          prior_distance=
          while IFS= read -r candidate
          do
            if [[ "$candidate" == "$TAG" \
              || ! "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9._-]+)?$ ]]
            then
              continue
            fi
            distance="$(git rev-list --count "${candidate}..${commit}")"
            if (( distance == 0 ))
            then
              continue
            fi
            if [[ -z "$prior_distance" ]] || (( distance < prior_distance ))
            then
              prior_tag="$candidate"
              prior_distance="$distance"
            fi
          done < <(git tag --merged "$commit" --list "v*" --sort=-version:refname)

          {
            echo "## Release preflight"
            echo
            printf -- "- **Pushed tag:** \`%s\`\n" "$TAG"
            printf -- "- **Resolved commit:** \`%s\`\n" "$commit"
            printf -- "- **Cargo package version:** \`%s\`\n" "$cargo_version"
            printf -- '- **Version consistency:** %s, %s\n' "$result" "$version_detail"
            echo
            echo "### Reviewed build inputs"
            echo
            printf -- "- **GitHub-hosted runner:** \`ubuntu-24.04\`\n"
            printf -- "- **Docker Buildx:** \`%s\`\n" "$BUILDX_VERSION"
            printf -- "- **BuildKit:** \`%s\`\n" "$BUILDKIT_IMAGE"
            echo "- **Rust toolchain selection:** tagged \`rust-toolchain.toml\`"
            printf -- "- **Node.js:** \`%s\`\n" "$NODE_VERSION"
            printf -- "- **wasm-pack:** \`%s\`\n" "$WASM_PACK_VERSION"
            while IFS= read -r image
            do
              printf -- "- **Docker base:** \`%s\`\n" "$image"
            done < <(awk '$1 == "FROM" { print $2 }' Dockerfile)
            if [[ -n "$prior_tag" ]]
            then
              range="${prior_tag}..${commit}"
              count="$(git rev-list --count "$range")"
              printf -- "- **Prior reachable version tag:** \`%s\`\n" "$prior_tag"
              printf -- "- **Commit range:** \`%s\` (%s commits)\n" "$range" "$count"
              echo
              echo "### Commits since $prior_tag"
              echo
              echo "\`\`\`text"
              git log --format="%h %s" --max-count=20 "$range"
              echo "\`\`\`"
              if (( count > 20 ))
              then
                echo "Showing the newest 20 of $count commits."
              fi
            else
              echo "- **Prior reachable version tag:** none"
              echo "- **Commit range:** unavailable without a prior version tag"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$result" != PASS ]]
          then
            echo "Release version consistency failed: $version_detail" >&2
            exit 1
          fi

  release:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      # required to mint the OIDC token used by actions/attest
      id-token: write
      # required to create the release and upload release assets
      contents: write
      # required to publish the release image and push its attestation
      packages: write

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]
          then
            echo "Release verification requires complete Git history" >&2
            exit 1
          fi
          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git show-ref --verify --quiet "$default_ref"
          then
            echo "Default branch ref is unavailable: $default_ref" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$default_ref"
          then
            echo "Release tag commit is not reachable from $default_ref" >&2
            exit 1
          fi

      - name: Prepare release metadata
        id: release
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          repo_lc="$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo_lc}"
          safe_tag="${GITHUB_REF_NAME//\//-}"
          prerelease=false
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[._-] ]]
          then
            prerelease=true
          fi
          {
            echo "repo=${repo}"
            echo "safe_tag=${safe_tag}"
            echo "prerelease=${prerelease}"
            echo "image=${image}"
            echo "image_ref=${image}:${safe_tag}"
            echo "server_asset=o-sfu-server-${safe_tag}-linux-amd64.tar.gz"
            echo "client_asset=o-sfu-client-${safe_tag}.js"
            echo "client_types_asset=o-sfu-client-${safe_tag}.d.ts"
            echo "sbom_asset=o-sfu-image-${safe_tag}.sbom.json"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        id: rust
        uses: ./.github/actions/setup-rust

      - name: Validate release tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([._-][A-Za-z0-9._-]+)?$ ]]
          then
            echo "Invalid release tag: $tag" >&2
            echo "Expected vX.Y.Z with an optional safe suffix" >&2
            exit 1
          fi
          base_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          cargo metadata --locked --no-deps --format-version 1 > "$metadata_file"
          cargo_version="$(python3 - "$metadata_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          manifest = f'{data["workspace_root"]}/Cargo.toml'
          for package in data["packages"]:
              if package["manifest_path"] == manifest:
                  print(package["version"])
                  break
          else:
              raise SystemExit("workspace root package version not found")
          PY
          )"
          cargo_base_version="${cargo_version%%[-+]*}"
          if [[ "$base_version" != "$cargo_base_version" ]]
          then
            echo "Release tag base version $base_version does not match Cargo base version $cargo_base_version" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false

      - name: Setup Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Login to GitHub Container Registry
        # docker/login-action v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        # docker/metadata-action v6
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.safe_tag }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Install client dependencies
        run: npm ci
        working-directory: crates/client

      - name: Build server binary
        run: cargo build --locked --release -p o-sfu

      - name: Build Odoo bundle
        run: npm run build:odoo
        working-directory: crates/client

      - name: Build and publish release image
        id: image
        # docker/build-push-action v7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Package release assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release
          tar -C target/release -czf "release/${{ steps.release.outputs.server_asset }}" o-sfu
          cp crates/client/dist/odoo_sfu.js "release/${{ steps.release.outputs.client_asset }}"
          cp crates/client/dist/odoo_sfu.d.ts "release/${{ steps.release.outputs.client_types_asset }}"
          docker buildx imagetools inspect "${{ steps.release.outputs.image_ref }}" \
            --format "{{json .SBOM}}" > "release/${{ steps.release.outputs.sbom_asset }}"
          if [[ ! -s "release/${{ steps.release.outputs.sbom_asset }}" ]] \
            || grep -qx "null" "release/${{ steps.release.outputs.sbom_asset }}"; then
            echo "The release image SBOM could not be extracted" >&2
            exit 1
          fi
          (
            cd release
            sha256sum \
              "${{ steps.release.outputs.server_asset }}" \
              "${{ steps.release.outputs.client_asset }}" \
              "${{ steps.release.outputs.client_types_asset }}" \
              "${{ steps.release.outputs.sbom_asset }}" > SHA256SUMS
          )
          {
            echo "server=release/${{ steps.release.outputs.server_asset }}"
            echo "client=release/${{ steps.release.outputs.client_asset }}"
            echo "client_types=release/${{ steps.release.outputs.client_types_asset }}"
            echo "sbom=release/${{ steps.release.outputs.sbom_asset }}"
            echo "checksums=release/SHA256SUMS"
          } >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestations
        # actions/attest v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}

      - name: Generate image attestation
        # actions/attest v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Write release notes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUSTC_VERSION: ${{ steps.rust.outputs.rustc-version }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          {
            echo "## Build provenance"
            echo
            printf -- "- **Version tag:** \`%s\`\n" "$GITHUB_REF_NAME"
            printf -- "- **Source commit:** \`%s\`\n" "$source_commit"
            echo "- **Cargo version:** tag base version matches the workspace root package version"
            printf -- "- **Default-branch ancestry:** source commit passed the \`%s\` ancestry gate\n" "$DEFAULT_BRANCH"
            echo "- **Runner OS generation:** \`ubuntu-24.04\`"
            printf -- "- **Docker Buildx:** \`%s\`\n" "$BUILDX_VERSION"
            printf -- "- **BuildKit:** \`%s\`\n" "$BUILDKIT_IMAGE"
            printf -- "- **Rust:** \`%s\`\n" "$RUSTC_VERSION"
            printf -- "- **Node.js:** \`%s\`\n" "$NODE_VERSION"
            printf -- "- **wasm-pack:** \`%s\`\n" "$WASM_PACK_VERSION"
            while IFS= read -r image
            do
              printf -- "- **Docker base:** \`%s\`\n" "$image"
            done < <(awk '$1 == "FROM" { print $2 }' Dockerfile)
            cat <<EOF

          ## verification

          release assets:

          \`\`\`bash
          gh attestation verify ${{ steps.release.outputs.server_asset }} -R ${{ steps.release.outputs.repo }}
          gh attestation verify ${{ steps.release.outputs.client_asset }} -R ${{ steps.release.outputs.repo }}
          gh attestation verify ${{ steps.release.outputs.client_types_asset }} -R ${{ steps.release.outputs.repo }}
          gh attestation verify ${{ steps.release.outputs.sbom_asset }} -R ${{ steps.release.outputs.repo }}
          sha256sum -c SHA256SUMS
          \`\`\`

          container image:

          \`\`\`text
          ${{ steps.release.outputs.image_ref }}
          \`\`\`

          container image verification:

          \`\`\`bash
          docker login ghcr.io
          gh attestation verify oci://${{ steps.release.outputs.image_ref }} -R ${{ steps.release.outputs.repo }}
          \`\`\`

          the container SBOM is attached to this release as \`${{ steps.release.outputs.sbom_asset }}\`

          Read the [DEPLOYMENT.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/DEPLOYMENT.md) for more information.

          EOF
          } > release/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$(cat release/notes.md)"
          release_flags=(--generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]
          then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.assets.outputs.server }}" \
            "${{ steps.assets.outputs.client }}" \
            "${{ steps.assets.outputs.client_types }}" \
            "${{ steps.assets.outputs.sbom }}" \
            "${{ steps.assets.outputs.checksums }}" \
            --title "o-sfu ${GITHUB_REF_NAME}" \
            --notes "$notes" \
            "${release_flags[@]}"
