name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fmt
            name: fmt
            nextest: false
            command: cargo fmt --check
          - id: library-nextest
            name: library nextest
            nextest: true
            command: >-
              cargo nextest run --locked --profile ci
              -p o-sfu-core
              -p o-sfu-model
              -p o-sfu-protocol
              -p o-sfu-rfc
              -p o-sfu-router
              -p o-sfu-telemetry
          - id: root-tests
            name: root tests
            nextest: false
            command: cargo test --locked -p o-sfu
          - id: integration-proofs
            name: integration and proof tests
            nextest: false
            command: cargo test --locked -p o-sfu-tests -p o-sfu-core-room-tests -p o-sfu-proofs
          - id: doctests
            name: doctests
            nextest: false
            command: cargo test --locked --doc
          - id: clippy
            name: clippy
            nextest: false
            command: cargo clippy --locked --all-targets --all-features -- -D warnings

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt clippy

      - name: Install cargo-nextest
        if: matrix.nextest
        run: cargo install cargo-nextest --version 0.9.136 --locked

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: ${{ matrix.id }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload nextest JUnit report
        if: always() && matrix.id == 'library-nextest'
        # actions/upload-artifact v4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-library-nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  release-default-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: mainline

      - name: Run release default-member tests
        run: cargo test --locked --release

  coverage-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: mainline

      - name: Generate default-member coverage report
        run: >-
          cargo llvm-cov --locked
          --package o-sfu
          --package o-sfu-core
          --package o-sfu-model
          --package o-sfu-protocol
          --package o-sfu-rfc
          --package o-sfu-router
          --package o-sfu-telemetry
          --package o-sfu-tests
          --package o-sfu-core-room-tests
          --package o-sfu-proofs
          --lcov --output-path lcov.info

      - name: Export coverage summary
        run: >-
          cargo llvm-cov report
          --package o-sfu
          --package o-sfu-core
          --package o-sfu-model
          --package o-sfu-protocol
          --package o-sfu-rfc
          --package o-sfu-router
          --package o-sfu-telemetry
          --package o-sfu-tests
          --package o-sfu-core-room-tests
          --package o-sfu-proofs
          --json --summary-only --output-path coverage-summary.json

      - name: Upload coverage artifacts
        # actions/upload-artifact v4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-default-members-coverage
          path: |
            lcov.info
            coverage-summary.json
          retention-days: 7

  container-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build server container image
        run: docker build --file Dockerfile --tag o-sfu:test .
