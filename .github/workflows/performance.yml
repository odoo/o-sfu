name: Performance

on:
  # keep this expensive Callgrind job scoped to room call-flow performance and benchmark ownership files
  push:
    branches: [main, master]
    paths:
      - .github/actions/setup-rust/**
      - .github/workflows/performance.yml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/core/Cargo.toml
      - crates/core/src/engine/room/**
      - crates/core/src/engine/source_model/**
      - crates/core/src/engine/media_transport/**
      - crates/core/src/engine/packet_sink_registry.rs
      - crates/core/src/engine/recording/**
      - crates/core/src/engine/media_transport/rtc/**
      - crates/router/Cargo.toml
      - crates/router/src/model/*.rs
      - crates/router/src/model/topology/**
      - tests/Cargo.toml
      - tests/benchmarks/**
  pull_request:
    branches: [main, master]
    paths:
      - .github/actions/setup-rust/**
      - .github/workflows/performance.yml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/core/Cargo.toml
      - crates/core/src/engine/room/**
      - crates/core/src/engine/source_model/**
      - crates/core/src/engine/media_transport/**
      - crates/core/src/engine/packet_sink_registry.rs
      - crates/core/src/engine/recording/**
      - crates/core/src/engine/media_transport/rtc/**
      - crates/router/Cargo.toml
      - crates/router/src/model/*.rs
      - crates/router/src/model/topology/**
      - tests/Cargo.toml
      - tests/benchmarks/**
  workflow_dispatch:
    # these knobs are for manual diagnosis only
    # pull requests keep using the deterministic slice summary path below
    inputs:
      base_ref:
        description: Base ref (must be in default-branch history when running on the default branch)
        required: false
        type: string
      worker_investigation:
        description: Run the manual current-thread worker benchmark on the head ref
        required: false
        default: false
        type: boolean
      cache_simulation:
        description: Enable Callgrind cache simulation for manual runs
        required: false
        default: false
        type: boolean
      branch_simulation:
        description: Enable Callgrind branch simulation for manual runs
        required: false
        default: false
        type: boolean
      flamegraphs:
        description: Generate flamegraph artifacts for the manual worker benchmark
        required: false
        default: false
        type: boolean
      dhat:
        description: Add DHAT allocation artifacts for manual runs
        required: false
        default: false
        type: boolean

# every job in this workflow is read-only because the benchmark job runs pull request code
# .github/workflows/performance-comment.yml owns PR comments from uploaded artifacts
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packet-loop-callgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # this job checks out and benchmarks pull request code, so it must not receive a write token
    permissions:
      contents: read

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
      INPUT_BRANCH_SIMULATION: ${{ github.event.inputs.branch_simulation }}
      INPUT_CACHE_SIMULATION: ${{ github.event.inputs.cache_simulation }}
      INPUT_DHAT: ${{ github.event.inputs.dhat }}
      INPUT_FLAMEGRAPHS: ${{ github.event.inputs.flamegraphs }}
      INPUT_WORKER_INVESTIGATION: ${{ github.event.inputs.worker_investigation }}
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Callgrind dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq valgrind

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Freeze Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: callgrind

      - name: Install Gungraun runner
        run: cargo install gungraun-runner --version 0.19.4 --locked

      - name: Configure manual investigation options
        id: investigation
        run: |
          set -euo pipefail

          # manual inputs are empty for push and pull_request events
          # every benchmark step still consumes the same outputs below
          callgrind_args=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CACHE_SIMULATION" == "true" ]]; then
            callgrind_args="--cache-sim=yes"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_BRANCH_SIMULATION" == "true" ]]; then
            callgrind_args="${callgrind_args:+${callgrind_args} }--branch-sim=yes"
          fi

          flamegraphs=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_FLAMEGRAPHS" == "true" ]]; then
            flamegraphs="1"
          fi

          # later steps export only non-empty outputs
          # this keeps push and pull_request runs on the default deterministic profile
          {
            echo "callgrind-args=${callgrind_args}"
            echo "flamegraphs=${flamegraphs}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve comparison refs
        id: refs
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/*:refs/remotes/origin/*
          default_sha="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          head_ref="$GITHUB_SHA"

          # pull requests compare the target branch commit against GitHub's synthetic merge commit
          # this catches the performance impact of the code exactly as it would enter the base branch
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PULL_REQUEST_BASE_SHA"
          # pushes compare the previous branch tip against the commit that triggered the workflow
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
          # manual runs use the requested base ref or the default branch when no input was provided
          else
            base_ref="${INPUT_BASE_REF:-$default_sha}"
          fi

          # An empty destination prevents base_ref from rewriting local refs.
          git fetch --no-tags -- origin "${base_ref}:" || true
          base_ref="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          git cat-file -e "${head_ref}^{commit}"

          # Default-branch runs can write caches reused by other workflows.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] &&
            ! git merge-base --is-ancestor "$base_ref" "$default_sha"; then
            echo "::error::Default-branch runs require base_ref to be in default-branch history."
            exit 1
          fi

          echo "base-ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "head-ref=${head_ref}" >> "$GITHUB_OUTPUT"

      - name: Verify the scenarios still exercise the code they measure
        run: |
          # a scenario that silently stopped branching would keep reporting stable
          # instruction counts, so the gate checks its own coverage before measuring
          #
          # both scenarios run from one test target rather than from a name filter:
          # a filter that matches nothing exits zero, so renaming a self-test away
          # would silently disarm this step
          git checkout --force "${{ steps.refs.outputs.head-ref }}"
          cargo test --locked -p o-sfu-tests --test benchmark_scenarios

      - name: Save base Callgrind baseline
        run: |
          callgrind_args='${{ steps.investigation.outputs.callgrind-args }}'
          if [[ -n "$callgrind_args" ]]; then
            export GUNGRAUN_CALLGRIND_ARGS="$callgrind_args"
          fi

          # Gungraun stores the named baseline under target/gungraun for the next step in this same job
          # a bench target that does not exist on the base ref cannot produce a baseline
          # the head step then runs it without a comparison instead of failing the job
          bench_target_present() {
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -e --arg target "$1" \
                '.packages[] | select(.name == "o-sfu-tests") | any(.targets[]; .name == $target and (.kind | index("bench")))' >/dev/null
          }

          git checkout --force "${{ steps.refs.outputs.base-ref }}"
          cargo bench --locked -p o-sfu-tests --bench packet_loop_callgrind -- --save-baseline=base --save-summary=json
          if bench_target_present meeting_flow_callgrind; then
            cargo bench --locked -p o-sfu-tests --bench meeting_flow_callgrind -- --save-baseline=base --save-summary=json
            echo "MEETING_FLOW_BASELINE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "meeting_flow_callgrind is not present on the base ref"
            echo "MEETING_FLOW_BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          if bench_target_present source_policy_callgrind; then
            cargo bench --locked -p o-sfu-tests --bench source_policy_callgrind -- --save-baseline=base --save-summary=json
            echo "SOURCE_POLICY_BASELINE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "source_policy_callgrind is not present on the base ref"
            echo "SOURCE_POLICY_BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          if bench_target_present general_call_callgrind; then
            cargo bench --locked -p o-sfu-tests --bench general_call_callgrind -- --save-baseline=base --save-summary=json
            echo "GENERAL_CALL_BASELINE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "general_call_callgrind is not present on the base ref"
            echo "GENERAL_CALL_BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Compare head Callgrind baseline
        run: |
          callgrind_args='${{ steps.investigation.outputs.callgrind-args }}'
          if [[ -n "$callgrind_args" ]]; then
            export GUNGRAUN_CALLGRIND_ARGS="$callgrind_args"
          fi

          # the head run loads the saved base baseline and emits JSON summaries with base-versus-head deltas
          git checkout --force "${{ steps.refs.outputs.head-ref }}"
          status=0
          cargo bench --locked -p o-sfu-tests --bench packet_loop_callgrind -- --baseline=base --save-summary=json || status=1
          if [[ "${MEETING_FLOW_BASELINE_AVAILABLE:-false}" == "true" ]]; then
            cargo bench --locked -p o-sfu-tests --bench meeting_flow_callgrind -- --baseline=base --save-summary=json || status=1
          else
            cargo bench --locked -p o-sfu-tests --bench meeting_flow_callgrind -- --save-summary=json || status=1
          fi
          if [[ "${SOURCE_POLICY_BASELINE_AVAILABLE:-false}" == "true" ]]; then
            cargo bench --locked -p o-sfu-tests --bench source_policy_callgrind -- --baseline=base --save-summary=json || status=1
          else
            cargo bench --locked -p o-sfu-tests --bench source_policy_callgrind -- --save-summary=json || status=1
          fi
          if [[ "${GENERAL_CALL_BASELINE_AVAILABLE:-false}" == "true" ]]; then
            cargo bench --locked -p o-sfu-tests --bench general_call_callgrind -- --baseline=base --save-summary=json || status=1
          else
            cargo bench --locked -p o-sfu-tests --bench general_call_callgrind -- --save-summary=json || status=1
          fi
          exit "$status"

      - name: Run manual worker Callgrind investigation
        if: github.event_name == 'workflow_dispatch' && inputs.worker_investigation
        run: |
          # worker investigation measures the whole command path on the head ref only
          # it is not a base-versus-head gate and it never feeds PR comments
          callgrind_args='${{ steps.investigation.outputs.callgrind-args }}'
          flamegraphs='${{ steps.investigation.outputs.flamegraphs }}'
          if [[ -n "$callgrind_args" ]]; then
            export GUNGRAUN_CALLGRIND_ARGS="$callgrind_args"
          fi
          if [[ -n "$flamegraphs" ]]; then
            export O_SFU_CALLGRIND_FLAMEGRAPHS="$flamegraphs"
          fi

          # this target is diagnostic only
          # normal pull_request runs never execute it
          # manual PR comments may show its top-level summary when this run maps to one open PR
          git checkout --force "${{ steps.refs.outputs.head-ref }}"
          cargo bench --locked -p o-sfu-tests --features worker-benchmarks --bench packet_loop_worker_callgrind -- --save-summary=json

      - name: Run manual DHAT investigation
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dhat && steps.refs.outcome == 'success' }}
        env:
          BASE_REF: ${{ steps.refs.outputs.base-ref }}
          HEAD_REF: ${{ steps.refs.outputs.head-ref }}
          # DHAT summaries must not overwrite Callgrind's performance results.
          GUNGRAUN_HOME: ${{ github.workspace }}/target/gungraun-dhat
        run: |
          status=0
          base_targets=()
          for revision in base head; do
            if [[ "$revision" == "base" ]]; then
              git checkout --force "$BASE_REF"
            else
              git checkout --force "$HEAD_REF"
            fi
            metadata=$(cargo metadata --locked --no-deps --format-version 1 | jq '.packages[] | select(.name == "o-sfu-tests")')
            if ! jq -e '.features | has("dhat")' <<< "$metadata" >/dev/null; then
              echo "Skipping DHAT on $revision: this revision has no separate DHAT mode"
              continue
            fi
            for target in packet_loop_callgrind meeting_flow_callgrind source_policy_callgrind general_call_callgrind; do
              if ! jq -e --arg target "$target" 'any(.targets[]; .name == $target and (.kind | index("bench")))' <<< "$metadata" >/dev/null; then
                continue
              fi
              baseline_args=()
              if [[ "$revision" == "base" ]]; then
                baseline_args=(--save-baseline=base)
              elif [[ " ${base_targets[*]} " == *" $target "* ]]; then
                baseline_args=(--baseline=base)
              fi
              if cargo bench --locked -p o-sfu-tests --features dhat --bench "$target" -- "${baseline_args[@]}" --save-summary=json; then
                if [[ "$revision" == "base" ]]; then
                  base_targets+=("$target")
                fi
              else
                status=1
              fi
            done
            if [[ "$revision" == "head" && "$INPUT_WORKER_INVESTIGATION" == "true" ]]; then
              cargo bench --locked -p o-sfu-tests --features dhat,worker-benchmarks --bench packet_loop_worker_callgrind -- --save-summary=json || status=1
            fi
          done
          exit "$status"

      - name: Collect Callgrind summaries
        if: always()
        run: |
          # collect summaries even after failures so the PR comment and artifact show what happened
          mkdir -p performance-artifacts
          mapfile -t summary_files < <(find target/gungraun -type f -name '*.json' | sort)
          if ((${#summary_files[@]})); then
            jq -s '.' "${summary_files[@]}" > performance-artifacts/callgrind-summary.json
          else
            printf '[]\n' > performance-artifacts/callgrind-summary.json
          fi
          {
            printf 'base_ref=%s\n' '${{ steps.refs.outputs.base-ref }}'
            printf 'head_ref=%s\n' '${{ steps.refs.outputs.head-ref }}'
            printf 'pull_request_number=%s\n' "$PULL_REQUEST_NUMBER"
            printf 'rust_toolchain=%s\n' "$RUSTUP_TOOLCHAIN"
            printf 'workflow_event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'worker_investigation=%s\n' "${INPUT_WORKER_INVESTIGATION:-false}"
            printf 'cache_simulation=%s\n' "${INPUT_CACHE_SIMULATION:-false}"
            printf 'branch_simulation=%s\n' "${INPUT_BRANCH_SIMULATION:-false}"
            printf 'flamegraphs=%s\n' "${INPUT_FLAMEGRAPHS:-false}"
            printf 'dhat=%s\n' "${INPUT_DHAT:-false}"
            printf 'callgrind_args=%s\n' '${{ steps.investigation.outputs.callgrind-args }}'
          } > performance-artifacts/callgrind-refs.env

      - name: Upload Callgrind artifacts
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # keep the raw Gungraun output available for local inspection when the summary is not enough
          name: packet-loop-callgrind-${{ github.run_id }}
          path: |
            target/gungraun/**
            performance-artifacts/callgrind-summary.json
            performance-artifacts/callgrind-refs.env
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DHAT artifacts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dhat
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packet-loop-dhat-${{ github.run_id }}
          path: |
            target/gungraun-dhat/**
            performance-artifacts/callgrind-refs.env
          if-no-files-found: warn
          retention-days: 14
