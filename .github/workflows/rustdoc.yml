name: Rustdoc

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: rustdoc

      - name: Build rustdoc
        run: >-
          cargo doc --locked --no-deps --document-private-items
          -p o-sfu
          -p o-sfu-core
          -p o-sfu-model
          -p o-sfu-protocol
          -p o-sfu-rfc
          -p o-sfu-router
          -p o-sfu-telemetry

      - name: Prepare rustdoc site
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>o-sfu rustdoc</title>
          <link rel="canonical" href="o_sfu/">
          <script>location.replace("o_sfu/")</script>
          <a href="o_sfu/">o-sfu rustdoc</a>
          HTML
          touch target/doc/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        # actions/configure-pages v5
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload rustdoc site
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        # actions/upload-pages-artifact v4
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: target/doc

  deploy:
    name: Deploy rustdoc
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
