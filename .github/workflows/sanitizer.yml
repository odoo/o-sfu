name: sanitizer

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/sanitizer.yml
      - Cargo.lock
      - Cargo.toml
      - crates/core/**
      - crates/model/**
      - crates/protocol/**
      - crates/rfc/**
      - crates/router/**
      - src/application/**
      - src/config/**
      - src/runtime/**
      - tests/Cargo.toml
      - tests/src/**
      - tests/integration/server_smoke.rs
      - tests/integration/full_stack.rs
      - tests/integration/full_stack/**
  pull_request:
    paths:
      - .github/workflows/sanitizer.yml
      - Cargo.lock
      - Cargo.toml
      - crates/core/**
      - crates/model/**
      - crates/protocol/**
      - crates/rfc/**
      - crates/router/**
      - src/application/**
      - src/config/**
      - src/runtime/**
      - tests/Cargo.toml
      - tests/src/**
      - tests/integration/server_smoke.rs
      - tests/integration/full_stack.rs
      - tests/integration/full_stack/**
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-Zsanitizer=address -C force-frame-pointers=yes"
  ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1"

jobs:
  address-sanitizer:
    name: address sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-04-01
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Install LLVM symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          echo "ASAN_SYMBOLIZER_PATH=$(command -v llvm-symbolizer)" >> "$GITHUB_ENV"

      - name: Run pure crate tests under ASan
        run: |
          cargo +nightly-2026-04-01 test --locked --target x86_64-unknown-linux-gnu \
            -p o-sfu-model -p o-sfu-rfc -p o-sfu-router -p o-sfu-protocol \
            --lib --tests -- --test-threads=1 --nocapture

      - name: Run core runtime tests under ASan
        run: |
          cargo +nightly-2026-04-01 test --locked --target x86_64-unknown-linux-gnu \
            -p o-sfu-core --lib --tests -- --test-threads=1 --nocapture

      - name: Run server smoke test under ASan
        run: |
          cargo +nightly-2026-04-01 test --locked --target x86_64-unknown-linux-gnu \
            -p o-sfu-tests --test server_smoke \
            websocket_welcome_and_initial_offer_work_from_integration_test \
            -- --exact --test-threads=1 --nocapture

      - name: Run same-worker RTC smoke test under ASan
        run: |
          cargo +nightly-2026-04-01 test --locked --target x86_64-unknown-linux-gnu \
            -p o-sfu-tests --test full_stack \
            video_routing::fake_rtc_peers_forward_vp8_high_rid_keyframe_without_browsers \
            -- --exact --test-threads=1 --nocapture

      - name: Run relay RTC smoke test under ASan
        run: |
          cargo +nightly-2026-04-01 test --locked --target x86_64-unknown-linux-gnu \
            -p o-sfu-tests --test full_stack \
            relay_spillover::fake_rtc_cross_worker_vp8_selected_rid_survives_relay \
            -- --exact --test-threads=1 --nocapture
