[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Remove once the dependency chain no longer includes pin-utils:
    # o-sfu-signaling-proxy -> rama-core -> tokio-graceful -> loom 0.7.2 -> pin-utils
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is an unmaintained transitive dependency of the signaling test proxy" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
include-dev = true
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
