[package]
name = "o-sfu-signaling-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.96"
publish.workspace = true

[lints]
workspace = true

[dependencies]
o-sfu-rfc.workspace = true
# Rama's facade pins time to 0.3.47. Components preserve the workspace's newer version.
rama-core = "0.4"
rama-http = "0.4"
rama-http-backend = "0.4"
rama-net = "0.4"
rama-tcp = "0.4"
rama-ws = { version = "0.4", features = ["compression"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "process"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
