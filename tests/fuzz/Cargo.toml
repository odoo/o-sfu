[package]
name = "o-sfu-fuzz"
version = "0.0.0"
publish = false
license = "LGPL-3.0-or-later"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = []
fuzz-targets = [
    "dep:http",
    "dep:libfuzzer-sys",
    "dep:o-sfu",
    "dep:o-sfu-core",
    "dep:o-sfu-protocol",
    "dep:serde_json",
]

[dependencies]
http = { version = "1", optional = true }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"], optional = true }
o-sfu = { path = "../..", optional = true }
o-sfu-core = { workspace = true, optional = true }
o-sfu-protocol = { workspace = true, optional = true }
secrecy = { version = "0.10.3" }
serde_json = { workspace = true, optional = true }

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
required-features = ["fuzz-targets"]
test = false
doc = false
bench = false

[[bin]]
name = "http_disconnect_auth"
path = "fuzz_targets/http_disconnect_auth.rs"
required-features = ["fuzz-targets"]
test = false
doc = false
bench = false

[[bin]]
name = "protocol_sequence"
path = "fuzz_targets/protocol_sequence.rs"
required-features = ["fuzz-targets"]
test = false
doc = false
bench = false

[[bin]]
name = "sdp_answer"
path = "fuzz_targets/sdp_answer.rs"
required-features = ["fuzz-targets"]
test = false
doc = false
bench = false

[[bin]]
name = "packet_loop_ingress_demux"
path = "fuzz_targets/packet_loop_ingress_demux.rs"
required-features = ["fuzz-targets"]
test = false
doc = false
bench = false
