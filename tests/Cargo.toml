[package]
name = "o-sfu-tests"
description = "Integration and verification tests for o-sfu"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["otel-tracing"]
otel-tracing = ["o-sfu/otel-tracing"]
worker-benchmarks = ["o-sfu-core/worker-benchmarks"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
o-sfu = { path = "..", default-features = false, features = ["testing-transport"] }
o-sfu-core = { path = "../crates/core", features = ["testing-transport"] }
o-sfu-protocol = { path = "../crates/protocol" }
o-sfu-rfc = { path = "../crates/rfc" }
o-sfu-router = { path = "../crates/router" }
o-sfu-telemetry = { path = "../crates/telemetry" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
str0m.workspace = true
str0m-netem = "0.4"
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true

[dev-dependencies]
o-sfu-core = { path = "../crates/core", features = ["internal-benchmarks"] }
o-sfu-router = { path = "../crates/router", features = ["test-support"] }

# the manual worker benchmark uses Callgrind client requests only on the ubuntu runner
# non-linux developer targets compile the same benchmark with no-op hooks
[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dev-dependencies]
gungraun = { version = "0.19.0", features = ["client_requests"] }

[target.'cfg(not(all(target_arch = "x86_64", target_os = "linux")))'.dev-dependencies]
gungraun = "0.19.0"

[lints]
workspace = true

[[bench]]
name = "packet_loop_callgrind"
path = "benchmarks/packet_loop_callgrind.rs"
harness = false

[[bench]]
name = "meeting_flow_callgrind"
path = "benchmarks/meeting_flow_callgrind.rs"
harness = false

[[bench]]
name = "source_policy_callgrind"
path = "benchmarks/source_policy_callgrind.rs"
harness = false

[[bench]]
name = "general_call_callgrind"
path = "benchmarks/general_call_callgrind.rs"
harness = false

[[bench]]
name = "packet_loop_worker_callgrind"
path = "benchmarks/packet_loop_worker_callgrind.rs"
harness = false
required-features = ["worker-benchmarks"]

[[test]]
name = "benchmark_scenarios"
path = "benchmarks/scenario_self_tests.rs"

[[test]]
name = "server_smoke"
path = "integration/server_smoke.rs"

[[test]]
name = "full_stack"
path = "integration/full_stack.rs"

[[test]]
name = "miri_auth_codec"
path = "miri/auth_codec.rs"

[[test]]
name = "miri_protocol_core"
path = "miri/protocol_core.rs"

[[test]]
name = "miri_rtp_negotiation"
path = "miri/rtp_negotiation.rs"
